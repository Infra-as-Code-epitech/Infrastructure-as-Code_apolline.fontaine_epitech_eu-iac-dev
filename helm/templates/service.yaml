apiVersion: v1
kind: Service
metadata:
  name: {{ include "api.fullname" . }}
  labels:
{{ include "api.labels" . | indent 2 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP

---
{{- if .Values.loadBalancer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.loadBalancer.name }}-lb
  labels:
{{ include "api.labels" . | indent 2 }}
  annotations:
{{ toYaml .Values.loadBalancer.annotations | nindent 4 }}
spec:
  type: {{ .Values.loadBalancer.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.loadBalancer.port }}
      targetPort: {{ .Values.loadBalancer.targetPort }}
      protocol: TCP
{{- end }}
