replicaCount: 2

image:
  repository: REPLACE_WITH_ECR_URL
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

loadBalancer:
  name : task-manager
  enabled: true
  type: LoadBalancer
  port: 80
  targetPort: 8000
  annotations: {}

env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: db-credentials
        key: DATABASE_URL

serviceAccount:
  create: true
  annotations: {}
  name: "app-sa"

ingress:
  enabled: false
  hosts: []
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

