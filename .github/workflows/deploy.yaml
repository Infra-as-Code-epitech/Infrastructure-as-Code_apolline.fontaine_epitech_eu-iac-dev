name: Deploy
run-name: ${{ github.actor }} run the ${{ github.workflow }} workflow
on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

jobs:
  # INFRASTRUCTURE layer
  infra:
    name: Deploy infra
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prd' || 'dev' }}
    steps:
      - name: Verify Variable
        run: |
          echo "Current environment: ${{ env.ENVIRONMENT }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@main
        with:
          role-to-assume: "arn:aws:iam::075006646450:role/oidc-role"
          aws-region: "eu-west-1"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"

      - name: Terraform Init
        working-directory: ./terraform/infra
        run: terraform init -backend-config=${{ env.ENVIRONMENT }}.config

      - name: Terraform Format
        working-directory: ./terraform/infra
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ./terraform/infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform/infra
        run: terraform plan -var-file=${{ env.ENVIRONMENT }}.tfvars

      - name: Terraform Apply
        working-directory: ./terraform/infra
        run: terraform apply -var-file=${{ env.ENVIRONMENT }}.tfvars -auto-approve
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      docker_username: ${{ steps.login-ecr.outputs.docker_username_075006646450_dkr_ecr_eu_west_1_amazonaws_com }}
      docker_password: ${{ steps.login-ecr.outputs.docker_password_075006646450_dkr_ecr_eu_west_1_amazonaws_com }}

  # APP layer
  app:
    name: Deploy app
    needs: infra
    runs-on: arc-runner-set
    services:
      internal-service:
        image: ${{ needs.infra.outputs.registry }}/github-runners:latest
        credentials:
          username: ${{ needs.infra.outputs.docker_username }}
          password: ${{ needs.infra.outputs.docker_password }}
        ports:
          - "80:80"
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prd' || 'dev' }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@main
        with:
          role-to-assume: "arn:aws:iam::075006646450:role/oidc-role"
          aws-region: "eu-west-1"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform/app
        run: terraform init -backend-config=${{ env.ENVIRONMENT }}.config

      - name: Terraform Format
        working-directory: ./terraform/app
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ./terraform/app
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform/app
        run: terraform plan -var-file=${{ env.ENVIRONMENT }}.tfvars

      - name: Terraform Apply
        working-directory: ./terraform/app
        run: terraform apply -var-file=${{ env.ENVIRONMENT }}.tfvars -auto-approve
