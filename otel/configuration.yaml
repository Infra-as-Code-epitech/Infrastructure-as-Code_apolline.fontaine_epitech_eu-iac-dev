apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: adot-collector
  namespace: adot-system
spec:
  mode: daemonset
  serviceAccount: adot-collector
  config: |
    receivers:
      prometheus:
        config:
          scrape_configs:
          - job_name: 'kubernetes-pods'
            kubernetes_sd_configs:
            - role: pod
    
    processors:
      batch:
    
    exporters:
      prometheusremotewrite:
        endpoint: "https://aps-workspaces.us-west-2.amazonaws.com/workspaces/ws-xxxxxxxx/api/v1/remote_write"
        auth:
          authenticator: sigv4auth
      
      awsxray:
        region: us-west-2
    
    extensions:
      sigv4auth:
        region: us-west-2
        service: aps
    
    service:
      extensions: [sigv4auth]
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [batch]
          exporters: [prometheusremotewrite]
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [awsxray]
