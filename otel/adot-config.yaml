receivers:
  otlp:
    protocols:
      grpc:
      http:
  
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 5s
          static_configs:
            - targets: ['0.0.0.0:8888']
        - job_name: k8s
          kubernetes_sd_configs:
          - role: pod
          relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          metric_relabel_configs:
          - source_labels: [__name__]
            regex: "(request_duration_seconds.*|response_duration_seconds.*)"
            action: keep
processors:
  batch: {}
  memory_limiter:
    limit_mib: 400
    spike_limit_mib: 100
    check_interval: "5s"

exporters:
  prometheusremotewrite:
    endpoint: "${amp_endpoint}api/v1/remote_write"
    auth:
      authenticator: "sigv4auth"

  awsxray:
    region: "${region}"

  awscloudwatchlogs:
    log_group_name: "/aws/eks/adot-logs"
    log_stream_name: "collector"
    region: "${region}"

extensions:
  sigv4auth:
    region: "${region}"
    service: "aps"

service:
  extensions: ["sigv4auth"]
  pipelines:
    metrics:
      receivers: ["otlp", "prometheus"]
      processors: ["memory_limiter", "batch"]
      exporters: ["prometheusremotewrite"]
    traces:
      receivers: ["otlp"]
      processors: ["memory_limiter", "batch"]
      exporters: ["awsxray"]
    logs:
      receivers: ["otlp"]
      processors: ["memory_limiter", "batch"]
      exporters: ["awscloudwatchlogs"]